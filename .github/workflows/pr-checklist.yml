name: PR Checklist

# Wiederverwendbarer Check "PR-Checkliste". Schlägt fehl, solange in der
# PR-Beschreibung noch Checkboxen offen sind. Nicht zutreffende Punkte
# werden mit "n/a" markiert und trotzdem abgehakt.
#
# Die Checklisten-Punkte stehen NICHT hier, sondern im PR-Template des
# jeweiligen Repos. Der Check vergleicht die PR-Beschreibung mit dem
# Template des PR-Stands; jedes Repo pflegt also seine eigene Liste.
#
# Zwei Arten von PRs:
# - Änderungs-PRs (Feature-Branch → dev, Hotfix → main): Standard-Template
#   (.github/pull_request_template.md).
# - Release-PRs (dev oder promote/* → main): Release-Template
#   .github/pull_request_template/release.md, falls vorhanden. Anlegen mit
#     gh pr create --base main --head dev --body-file .github/pull_request_template/release.md
#   oder im Browser über .../compare/main...dev?expand=1&template=release.md
# Damit nicht die (längere) Änderungs-Checkliste einen Release-PR besteht,
# muss die Überschrift der Checkliste aus dem Template in der Beschreibung
# stehen ("## Checkliste" bzw. "## Release-Checkliste").
#
# Dependabot-PRs werden übersprungen: Dependabot legt PRs über die API an,
# ohne Template. Ein übersprungener Job zählt als bestandener Required
# Check; das Review auf `main` bleibt Pflicht.
#
# Aufruf aus einem Repo (.github/workflows/pr-checklist.yml):
#
#   on:
#     pull_request:
#       types: [opened, edited, reopened, synchronize, ready_for_review]
#       branches: [main, dev]
#   permissions:
#     contents: read
#   jobs:
#     checklist:
#       name: PR Checklist
#       uses: DHBW-AppStore-T3/.github/.github/workflows/pr-checklist.yml@main
#
# Der Merge ist nur blockiert, wenn "PR Checklist / Checkliste" in den
# Rulesets von `main` und `dev` als Required Status Check eingetragen ist
# (Ruleset "PR checklist must pass").
on:
  workflow_call:
    inputs:
      template-path:
        description: Pfad zum Standard-PR-Template. Leer = automatisch suchen.
        type: string
        default: ""

permissions:
  contents: read

jobs:
  checklist:
    name: Checkliste
    # Nach dem PR-Autor, nicht nach github.actor: Bearbeitet ein Mensch die
    # Beschreibung eines Dependabot-PRs, bleibt der Check übersprungen.
    if: github.event.pull_request.user.login != 'dependabot[bot]'
    runs-on: ubuntu-latest
    concurrency:
      group: pr-checklist-${{ github.repository }}-${{ github.event.pull_request.number }}
      cancel-in-progress: true

    steps:
      - name: Require pull_request event
        if: github.event_name != 'pull_request'
        run: |
          echo "::error::Der Checklisten-Check braucht ein pull_request-Event (war: ${{ github.event_name }})."
          exit 1

      # Template aus dem PR-Stand (Merge-Commit), damit ein PR, der das
      # Template selbst ändert, gegen die neue Fassung geprüft wird. Wer die
      # Checkliste im Template kürzt, tut das sichtbar im Diff, den die
      # reviewende Person freigibt; Kürzen nur in der Beschreibung fängt
      # der Abgleich unten ab.
      - name: Checkout PR template
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            /.github/
            /[Pp][Uu][Ll][Ll]_[Rr][Ee][Qq][Uu][Ee][Ss][Tt]_[Tt][Ee][Mm][Pp][Ll][Aa][Tt][Ee].md
            /docs/[Pp][Uu][Ll][Ll]_[Rr][Ee][Qq][Uu][Ee][Ss][Tt]_[Tt][Ee][Mm][Pp][Ll][Aa][Tt][Ee].md
          sparse-checkout-cone-mode: false

      - name: Check checklist in PR description
        env:
          # Über env statt direkter ${{ }}-Interpolation im Skript, damit
          # der PR-Text nicht als Shell-Code ausgeführt werden kann.
          PR_BODY: ${{ github.event.pull_request.body }}
          TEMPLATE_PATH: ${{ inputs.template-path }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          REPO: ${{ github.repository }}
          SERVER_URL: ${{ github.server_url }}
        run: |
          # Release-PR: dev oder promote/* aus diesem Repo nach main.
          release=false
          if [ "$BASE_REF" = main ] && [ "$HEAD_REPO" = "$REPO" ]; then
            case "$HEAD_REF" in dev|promote/*) release=true ;; esac
          fi

          template=""
          if [ "$release" = true ]; then
            template=$(find .github -maxdepth 2 -type f -ipath '.github/pull_request_template/release.md' 2>/dev/null | head -n1)
            if [ -z "$template" ]; then
              echo "::warning title=Kein Release-Template::Release-PR, aber kein .github/pull_request_template/release.md gefunden. Prüfe gegen das Standard-Template."
            fi
          fi

          # Gleiche Suchorte wie GitHub: .github/, Repo-Root, docs/.
          if [ -z "$template" ]; then
            template="$TEMPLATE_PATH"
          fi
          if [ -z "$template" ]; then
            for dir in .github . docs; do
              template=$(find "$dir" -maxdepth 1 -type f -iname 'pull_request_template.md' 2>/dev/null | head -n1)
              [ -n "$template" ] && break
            done
          fi
          if [ -z "$template" ] || [ ! -f "$template" ]; then
            echo "::error title=PR-Template fehlt::Kein pull_request_template.md im Repo gefunden."
            exit 1
          fi
          echo "Template: $template (Release-PR: $release)"

          # HTML-Kommentare und Code-Blöcke ignorieren (Beispiele im Template).
          strip() { tr -d '\r' | perl -0pe 's/<!--.*?-->//gs; s/^```.*?^```//gms'; }

          body=$(printf '%s' "$PR_BODY" | strip)
          tmpl=$(strip < "$template")

          # Überschrift, unter der die Checkliste im Template steht.
          heading=$(printf '%s\n' "$tmpl" | awk '/^## /{h=$0} /^[[:space:]]*[-*+] \[[ xX]\] /{print h; exit}' | sed 's/[[:space:]]*$//')
          if [ -n "$heading" ] && ! printf '%s\n' "$body" | sed 's/[[:space:]]*$//' | grep -qxF -- "$heading"; then
            echo "::error title=Falsche Checkliste::Die Überschrift \"${heading}\" aus ${template} fehlt in der PR-Beschreibung. Checkliste aus ${template} übernehmen."
            if [ "$release" = true ]; then
              echo "Release-PR: Beschreibung aus ${template} übernehmen, z. B. über ${SERVER_URL}/${REPO}/compare/main...${HEAD_REF}?expand=1&template=release.md"
            fi
            exit 1
          fi

          expected=$(printf '%s\n' "$tmpl" | grep -cE '^\s*[-*+] \[[ xX]\] ' || true)
          checked=$(printf '%s\n' "$body"  | grep -cE '^\s*[-*+] \[[xX]\] '  || true)
          open=$(printf '%s\n' "$body"     | grep -E  '^\s*[-*+] \[ \] '     || true)

          echo "Checkliste: ${checked} abgehakt, Template erwartet ${expected}."

          if [ -n "$open" ]; then
            echo "::error title=PR-Checkliste unvollständig::Offene Punkte in der PR-Beschreibung. Abhaken oder mit 'n/a' markieren und abhaken."
            printf '%s\n' "$open"
            exit 1
          fi

          if [ "$checked" -lt "$expected" ]; then
            echo "::error title=PR-Checkliste fehlt::Nur ${checked} von ${expected} Checklisten-Punkten in der PR-Beschreibung. Checkliste aus ${template} vollständig übernehmen."
            exit 1
          fi

          echo "✅ Checkliste vollständig."
